---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - infrastructure.cluster.x-k8s.io.giantswarm.io
  resources:
  - awsclusters
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - infrastructure.cluster.x-k8s.io.giantswarm.io
  resources:
  - awsclusters/finalizers
  verbs:
  - update
- apiGroups:
  - infrastructure.cluster.x-k8s.io.giantswarm.io
  resources:
  - awsclusters/status
  verbs:
  - get
  - patch
  - update
